[tasks.server]
description = "Run FinishLine Control Room (:8000) and Target Service (:8001)"
alias = ["web", "serve"]
run = "uv run mongodb-hackathon"

[tasks.dev]
description = "Run FinishLine Control Room (:8000) and Target Service (:8001) with auto-reload"
run = "uv run mongodb-hackathon --reload"

[tasks.walkthrough]
description = "Serve the architecture walkthrough on 0.0.0.0:${WALKTHROUGH_PORT:-8090}"
run = 'python3 -m http.server "${WALKTHROUGH_PORT:-8090}" --bind 0.0.0.0 --directory docs/walkthrough'

[tasks.sync]
description = "Sync Python dependencies with uv"
run = "uv sync"

[tasks.seed]
description = "Seed MongoDB Atlas collections, Vector Search index, and starter repos/rules"
run = "uv run python -m mongodb_hackathon.seed"

[tasks.lint]
description = "Run Ruff linter"
run = "uv run ruff check ."

[tasks.typecheck]
description = "Run ty type checker"
run = "uv run ty check"

[tasks.test]
description = "Run fast offline unit tests (excludes Atlas/Docker integration and e2e)"
run = "uv run pytest -v"

[tasks.test-integration]
description = "Run live MongoDB Atlas and integration tests"
run = "uv run pytest -v -m integration"

[tasks.test-all]
description = "Run full unit, integration, and e2e test suite"
run = "uv run pytest -v -m ''"

[tasks.check]
description = "Run lint, typecheck, and pytest in sequence"
run = [
  "uv run ruff check .",
  "uv run ty check",
  "uv run pytest -v",
]

[tasks.evals]
description = "Run LangSmith evaluation suite"
run = "uv run python scripts/run_evals.py"
