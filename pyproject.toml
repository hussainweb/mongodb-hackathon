[project]
name = "mongodb-hackathon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hw", email = "hussainweb@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
mongodb-hackathon = "mongodb_hackathon:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.5",
    "ty>=0.0.103",
]

[tool.ruff]
target-version = "py314"
extend-exclude = [".agents/skills"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = [".agents/skills"]
