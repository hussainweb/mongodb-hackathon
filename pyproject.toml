[project]
name = "mongodb-hackathon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hw", email = "hussainweb@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "elevenlabs>=2.78.0",
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langsmith>=0.14.17",
    "openai>=3.51.0",
    "pydantic>=2.14.3",
    "pydantic-ai>=2.68.0",
    "pydantic-settings>=2.16.3",
    "pymongo>=4.20.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
mongodb-hackathon = "mongodb_hackathon:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
    "ty>=0.0.103",
]

[tool.ruff]
target-version = "py314"
extend-exclude = [".agents/skills"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = [".agents/skills"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not integration and not e2e'"
markers = [
    "integration: tests requiring live MongoDB Atlas or external APIs",
    "e2e: slow end-to-end tests exercising live Docker containers and OpenTofu",
]
