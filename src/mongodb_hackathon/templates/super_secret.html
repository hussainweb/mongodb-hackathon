<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>FinishLine — Live Worker Lane</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏁</text></svg>" />
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    .stage {
      min-height: 100dvh;
      max-width: 720px;
      margin: 0 auto;
      padding: max(12px, env(safe-area-inset-top)) 12px max(16px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
    }
    .meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 2px;
    }
    .meta-left,
    .meta-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .brand-mark {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      white-space: nowrap;
    }
    .pill-ok {
      background: #ecfdf5;
      border-color: #a7f3d0;
      color: #047857;
    }
    .pill-info {
      background: #eff6ff;
      border-color: #bfdbfe;
      color: #1d4ed8;
    }
    .pill-danger {
      background: #fef2f2;
      border-color: #fecaca;
      color: #b91c1c;
    }
    .pill-warn {
      background: #fffbeb;
      border-color: #fde68a;
      color: #b45309;
    }
    .lane-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .lane-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }
    .lane-caption {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
    }
    .lane-counters {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .lane-canvas-wrap {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      overflow: hidden;
    }
    #worker-lane-canvas {
      display: block;
      width: 100%;
      height: clamp(230px, 44dvh, 360px);
    }
    .kill-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 4px 0 0;
    }
    .kill-btn {
      width: 100%;
      max-width: 420px;
      min-height: 58px;
      padding: 14px 22px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s ease, background 0.15s ease, box-shadow 0.15s ease, color 0.15s ease;
    }
    .kill-btn-armed {
      background: #dc2626;
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(220, 38, 38, 0.28);
    }
    .kill-btn-armed:hover {
      background: #b91c1c;
    }
    .kill-btn-armed:active {
      transform: scale(0.97);
    }
    .kill-btn-crashed {
      background: #fffbeb;
      border-color: #fcd34d;
      color: #92400e;
      cursor: not-allowed;
      box-shadow: none;
    }
    .kill-btn-idle {
      background: #e2e8f0;
      border-color: #cbd5e1;
      color: #475569;
      cursor: not-allowed;
      box-shadow: none;
    }
    .kill-hint {
      font-size: 12.5px;
      color: var(--muted);
      text-align: center;
      line-height: 1.4;
      min-height: 18px;
    }
    @media (min-width: 640px) {
      .stage {
        padding: 24px 20px;
        gap: 16px;
      }
      .lane-card {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="meta-bar">
      <div class="meta-left">
        <span class="brand-mark">🏁 FinishLine</span>
        <span id="secret-status-badge" class="pill">Standby</span>
      </div>
      <div class="meta-right">
        <span id="secret-pid-badge" class="pill mono">PID —</span>
        <span id="secret-crash-pill" class="pill mono">0 SIGKILLs</span>
      </div>
    </div>

    <section class="lane-card" aria-label="Live worker traffic illustration">
      <div class="lane-head">
        <div id="lane-caption" class="lane-caption">Probing container capacity vs. 300 RPS burst…</div>
        <div class="lane-counters">
          <span class="pill pill-ok mono" id="lane-delivered-badge">Delivered 0</span>
          <span class="pill pill-danger mono" id="lane-dropped-badge">Dropped 0</span>
        </div>
      </div>
      <div class="lane-canvas-wrap">
        <canvas id="worker-lane-canvas"></canvas>
      </div>
    </section>

    <section class="kill-stage" aria-label="Audience chaos control">
      <button type="button" id="btn-audience-kill" class="kill-btn kill-btn-idle" disabled>
        Waiting for Live Worker…
      </button>
      <div id="audience-kill-msg" class="kill-hint">
        Activates automatically when an agent worker is running.
      </div>
    </section>
  </main>

  <script src="/static/live-run.js"></script>
  <script>
    const REQUESTED_RUN_ID = {{ requested_run_id | default('') | tojson }};
    const INITIAL_SNAPSHOT = {{ initial_snapshot | default(none) | tojson }};

    let currentRunId = "";
    let currentRun = null;
    let killCooldownUntil = 0;
    let lastKilledPid = null;
    let killInFlight = false;

    const laneState = {
      workers: [],
      totalCapacityRps: 120,
      incomingDemandRps: 300,
      deliveredCount: 0,
      droppedCount: 0,
      killedFlashUntil: 0,
    };

    function formatStatus(status) {
      if (window.FinishLineLiveRun) {
        return FinishLineLiveRun.formatStatus(status);
      }
      return String(status || "unknown");
    }

    function statusPillClass(status) {
      const s = String(status || "").toLowerCase();
      if (s === "completed") return "pill pill-ok";
      if (s === "running") return "pill pill-info";
      if (s === "awaiting_approval") return "pill pill-warn";
      if (s === "crashed" || s === "failed" || s === "rolled_back") return "pill pill-danger";
      return "pill";
    }

    function isWorkerKillable(run) {
      if (!run) return false;
      if (run.status !== "running") return false;
      if (!run.worker_pid) return false;
      if (run.worker_alive === false) return false;
      return true;
    }

    function updateKillButton() {
      const btn = document.getElementById("btn-audience-kill");
      const msg = document.getElementById("audience-kill-msg");
      if (!btn || !msg) return;

      // If a brand-new worker PID spawned after a crash, re-arm right away
      if (currentRun && currentRun.worker_pid && lastKilledPid && currentRun.worker_pid !== lastKilledPid) {
        killCooldownUntil = 0;
        lastKilledPid = null;
      }

      const now = Date.now();
      const inCooldown = now < killCooldownUntil;
      const killable = isWorkerKillable(currentRun);

      if (killInFlight) {
        btn.disabled = true;
        btn.className = "kill-btn kill-btn-crashed";
        btn.textContent = "💥 Sending SIGKILL…";
        return;
      }

      if (inCooldown || (currentRun && currentRun.status === "crashed")) {
        btn.disabled = true;
        btn.className = "kill-btn kill-btn-crashed";
        btn.textContent = "⚡ Worker Killed — Recovering…";
        msg.textContent = currentRun && currentRun.auto_respawn
          ? "Checkpoints saved in MongoDB Atlas · respawning fresh PID…"
          : "Checkpoints preserved in MongoDB Atlas · 0 duplicate side effects.";
        return;
      }

      if (killable) {
        btn.disabled = false;
        btn.className = "kill-btn kill-btn-armed";
        btn.textContent = `💥 SIGKILL Worker · PID ${currentRun.worker_pid}`;
        msg.textContent = "Tap to crash the agent mid-flight and watch checkpoint recovery.";
        return;
      }

      btn.disabled = true;
      btn.className = "kill-btn kill-btn-idle";
      btn.textContent = "Waiting for Live Worker…";
      if (!currentRun) {
        msg.textContent = "No agent running right now — activates automatically when a run starts.";
      } else if (currentRun.status === "completed") {
        msg.textContent = "Latest run finished cleanly — start a new run to arm SIGKILL.";
      } else if (currentRun.status === "awaiting_approval" || currentRun.step_paused) {
        msg.textContent = "Agent paused at approval gate — waiting for operator approval.";
      } else {
        msg.textContent = `Standby (${formatStatus(currentRun.status)}) — waiting for live PID.`;
      }
    }

    function renderSecretSnapshot(snap) {
      if (!snap) return;
      const run = snap.run || null;
      const target = snap.target || {};

      if (!run) {
        currentRun = null;
        currentRunId = "";
        const statusEl = document.getElementById("secret-status-badge");
        const pidEl = document.getElementById("secret-pid-badge");
        const crashEl = document.getElementById("secret-crash-pill");
        if (statusEl) {
          statusEl.textContent = "Standby";
          statusEl.className = "pill";
        }
        if (pidEl) {
          pidEl.textContent = "PID —";
          pidEl.className = "pill mono";
        }
        if (crashEl) crashEl.textContent = "0 SIGKILLs";
        updateKillButton();
        return;
      }

      currentRun = run;
      currentRunId = run.run_id;

      const statusEl = document.getElementById("secret-status-badge");
      if (statusEl) {
        const displayStatus =
          run.status === "running" && run.worker_pid && run.worker_alive === false
            ? "Stopped"
            : formatStatus(run.status);
        statusEl.textContent = displayStatus;
        statusEl.className =
          run.status === "running" && run.worker_pid && run.worker_alive === false
            ? "pill"
            : statusPillClass(run.status);
      }

      const pidEl = document.getElementById("secret-pid-badge");
      if (pidEl) {
        if (isWorkerKillable(run)) {
          pidEl.textContent = `PID ${run.worker_pid}`;
          pidEl.className = "pill pill-ok mono";
        } else if (run.status === "crashed") {
          pidEl.textContent = "KILLED";
          pidEl.className = "pill pill-danger mono";
          laneState.killedFlashUntil = Math.max(laneState.killedFlashUntil, Date.now() + 1800);
        } else {
          pidEl.textContent = "PID —";
          pidEl.className = "pill mono";
        }
      }

      const crashEl = document.getElementById("secret-crash-pill");
      if (crashEl) {
        const count = Number(run.crash_count || 0);
        crashEl.textContent = `${count} SIGKILL${count === 1 ? "" : "s"}`;
      }

      const targetDeps = (target.deployments || []).filter((d) => d.active);
      if (laneState.workers.length === 0 && targetDeps.length > 0) {
        const cap = targetDeps.reduce((acc, d) => acc + Number(d.max_rps || d.rate_limit || 120), 0);
        laneState.totalCapacityRps = cap;
        laneState.workers = targetDeps.map((d, i) => ({
          name: d.service_name || `worker-${i + 1}`,
          container_id: String(d.deployment_id || "").slice(0, 8),
          port: 8001,
          max_rps: Number(d.max_rps || d.rate_limit || 120),
          healthy: true,
          active: true,
        }));
      }

      updateKillButton();
    }

    async function audienceKill() {
      if (!currentRunId || killInFlight || !isWorkerKillable(currentRun)) {
        updateKillButton();
        return;
      }
      killInFlight = true;
      lastKilledPid = currentRun.worker_pid;
      killCooldownUntil = Date.now() + 3000;
      updateKillButton();

      try {
        const resp = await fetch(`/runs/${encodeURIComponent(currentRunId)}/kill?source=audience`, {
          method: "POST",
        });
        const msg = document.getElementById("audience-kill-msg");
        if (resp.ok) {
          laneState.killedFlashUntil = Date.now() + 1800;
          if (msg) {
            msg.textContent = "💥 Direct hit! Checkpoints safe in MongoDB Atlas.";
          }
        } else {
          const err = await resp.json().catch(() => ({}));
          killCooldownUntil = 0;
          if (msg) {
            msg.textContent = err.detail || "Worker already stopped.";
          }
        }
      } catch (e) {
        console.warn("Audience kill error:", e);
        killCooldownUntil = 0;
      } finally {
        killInFlight = false;
        updateKillButton();
        setTimeout(updateKillButton, 3100);
      }
    }

    async function pollDockerTopology() {
      try {
        const resp = await fetch("/api/docker-topology?simulate=true");
        if (!resp.ok) return;
        const data = await resp.json();
        const workers = data.workers || [];
        if (workers.length > 0) {
          laneState.workers = workers;
          laneState.totalCapacityRps = Number(data.total_capacity_rps || 0);
        } else if (!currentRun || currentRun.status === "rolled_back") {
          laneState.workers = [];
          laneState.totalCapacityRps = 120;
        }

        const capEl = document.getElementById("lane-caption");
        if (capEl) {
          capEl.textContent = laneState.workers.length > 0
            ? `${laneState.workers.length} Docker worker(s) · ${laneState.totalCapacityRps} / ${laneState.incomingDemandRps} RPS`
            : `Baseline 1 worker (${laneState.totalCapacityRps} / ${laneState.incomingDemandRps} RPS)`;
        }
      } catch (e) {
        console.warn("Topology poll failed:", e);
      }
    }

    function roundRectPath(c, x, y, w, h, r) {
      const radius = Math.min(r, w * 0.5, h * 0.5);
      c.beginPath();
      c.moveTo(x + radius, y);
      c.arcTo(x + w, y, x + w, y + h, radius);
      c.arcTo(x + w, y + h, x, y + h, radius);
      c.arcTo(x, y + h, x, y, radius);
      c.arcTo(x, y, x + w, y, radius);
      c.closePath();
    }

    const canvas = document.getElementById("worker-lane-canvas");
    const ctx = canvas.getContext("2d");
    const parcels = [];
    let lastSpawn = 0;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const w = Math.max(280, Math.floor(rect.width));
      const h = Math.max(200, Math.floor(rect.height));
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    if (typeof ResizeObserver !== "undefined") {
      new ResizeObserver(resizeCanvas).observe(canvas);
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function spawnParcel(w, h, startX) {
      const workers = laneState.workers.length > 0
        ? laneState.workers
        : [{ name: "worker-1", container_id: "120rps", port: 8080, max_rps: 120, active: true, healthy: true }];

      const cap = laneState.totalCapacityRps || 120;
      const healthyCount = workers.filter((wk) => wk.active && wk.healthy).length;
      const passRatio = healthyCount === 0 ? 0.0 : Math.min(1.0, cap / laneState.incomingDemandRps);
      const willPass = Math.random() < passRatio;
      const targetIdx = Math.floor(Math.random() * workers.length);

      parcels.push({
        x: startX,
        y: h * 0.5 + (Math.random() - 0.5) * 24,
        vx: (w < 460 ? 2.1 : 2.9) + Math.random() * 0.9,
        vy: 0,
        targetIdx,
        willPass,
        resolved: false,
        color: "#2563eb",
      });
    }

    function drawFrame(ts) {
      const rect = canvas.getBoundingClientRect();
      const w = rect.width || 360;
      const h = rect.height || 240;
      const compact = w < 460;

      const emitX = compact ? 8 : 14;
      const emitW = compact ? 50 : 64;
      const emitH = compact ? 46 : 56;

      const chuteW = compact ? 70 : 92;
      const chuteH = compact ? 44 : 54;
      const rightX = w - chuteW - (compact ? 8 : 14);

      const midLeft = emitX + emitW + (compact ? 10 : 20);
      const midRight = rightX - (compact ? 10 : 20);
      const availMid = Math.max(84, midRight - midLeft);
      const boxW = Math.min(144, Math.max(82, availMid * 0.72));
      const midX = midLeft + (availMid - boxW) * 0.5;

      if (ts - lastSpawn > 210) {
        lastSpawn = ts;
        spawnParcel(w, h, emitX + emitW);
      }

      ctx.clearRect(0, 0, w, h);

      // Track guides
      const delivY = h * 0.16;
      const dropY = h * 0.62;
      ctx.strokeStyle = "#e2e8f0";
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(emitX + emitW, h * 0.5);
      ctx.lineTo(midX + boxW * 0.5, h * 0.5);
      ctx.lineTo(rightX, delivY + chuteH * 0.5);
      ctx.moveTo(midX + boxW * 0.5, h * 0.5);
      ctx.lineTo(rightX, dropY + chuteH * 0.5);
      ctx.stroke();
      ctx.setLineDash([]);

      // Left emitter
      ctx.fillStyle = "#1e293b";
      roundRectPath(ctx, emitX, h * 0.5 - emitH * 0.5, emitW, emitH, 10);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.font = compact ? "600 10px system-ui, sans-serif" : "600 11px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Burst", emitX + emitW * 0.5, h * 0.5 - 3);
      ctx.fillText("300 RPS", emitX + emitW * 0.5, h * 0.5 + 12);

      // Middle worker containers
      const workers = laneState.workers.length > 0
        ? laneState.workers
        : [{ name: "baseline-1", container_id: "cap 120", port: "—", max_rps: 120, active: true, healthy: true }];
      const gapY = compact ? 8 : 10;
      const boxH = Math.min(52, (h - 28) / Math.max(workers.length, 1) - gapY);
      const totalH = workers.length * boxH + (workers.length - 1) * gapY;
      const startY = (h - totalH) * 0.5;

      workers.forEach((wk, i) => {
        const y = startY + i * (boxH + gapY);
        const ok = wk.active && wk.healthy;
        ctx.fillStyle = ok ? "#ecfdf5" : "#fef2f2";
        ctx.strokeStyle = ok ? "#16a34a" : "#dc2626";
        ctx.lineWidth = 2;
        roundRectPath(ctx, midX, y, boxW, boxH, 8);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#0f172a";
        ctx.font = compact ? "600 10px ui-monospace, monospace" : "600 11px ui-monospace, monospace";
        ctx.textAlign = "center";
        const label = String(wk.name || `worker-${i + 1}`).slice(0, compact ? 12 : 16);
        ctx.fillText(label, midX + boxW * 0.5, y + boxH * 0.42);
        ctx.fillStyle = ok ? "#15803d" : "#b91c1c";
        ctx.font = compact ? "500 9.5px ui-monospace, monospace" : "500 10.5px ui-monospace, monospace";
        const sub = ok
          ? (compact ? `:${wk.port} (${wk.max_rps})` : `${wk.container_id} · :${wk.port} (${wk.max_rps})`)
          : "UNHEALTHY";
        ctx.fillText(sub, midX + boxW * 0.5, y + boxH * 0.77);
      });

      // Right chutes
      ctx.fillStyle = "#f0fdf4";
      ctx.strokeStyle = "#16a34a";
      ctx.lineWidth = 2;
      roundRectPath(ctx, rightX, delivY, chuteW, chuteH, 10);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#15803d";
      ctx.font = compact ? "700 10.5px system-ui, sans-serif" : "700 11.5px system-ui, sans-serif";
      ctx.fillText("Delivered", rightX + chuteW * 0.5, delivY + chuteH * 0.42);
      ctx.font = compact ? "600 10.5px ui-monospace, monospace" : "600 11px ui-monospace, monospace";
      ctx.fillText(String(laneState.deliveredCount), rightX + chuteW * 0.5, delivY + chuteH * 0.76);

      ctx.fillStyle = "#fef2f2";
      ctx.strokeStyle = "#dc2626";
      roundRectPath(ctx, rightX, dropY, chuteW, chuteH, 10);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#b91c1c";
      ctx.font = compact ? "700 10.5px system-ui, sans-serif" : "700 11.5px system-ui, sans-serif";
      ctx.fillText("Dropped", rightX + chuteW * 0.5, dropY + chuteH * 0.42);
      ctx.font = compact ? "600 10.5px ui-monospace, monospace" : "600 11px ui-monospace, monospace";
      ctx.fillText(String(laneState.droppedCount), rightX + chuteW * 0.5, dropY + chuteH * 0.76);

      // Parcels
      const midTargetX = midX + boxW * 0.5;
      for (let i = parcels.length - 1; i >= 0; i--) {
        const p = parcels[i];
        const wkIdx = Math.min(p.targetIdx, workers.length - 1);
        const targetWorkerY = startY + wkIdx * (boxH + gapY) + boxH * 0.5;

        if (!p.resolved) {
          p.y += (targetWorkerY - p.y) * 0.09;
          if (p.x >= midTargetX) {
            p.resolved = true;
            const stepsToRight = Math.max(12, (rightX - p.x) / Math.max(p.vx, 1));
            const destY = p.willPass ? (delivY + chuteH * 0.5) : (dropY + chuteH * 0.5);
            p.color = p.willPass ? "#16a34a" : "#dc2626";
            p.vy = (destY - p.y) / stepsToRight;
          }
        } else {
          p.y += p.vy;
        }
        p.x += p.vx;

        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, compact ? 4.5 : 5.5, 0, Math.PI * 2);
        ctx.fill();

        if (p.x >= rightX + 6) {
          if (p.willPass) laneState.deliveredCount += 1;
          else laneState.droppedCount += 1;
          parcels.splice(i, 1);
        }
      }

      const delivBadge = document.getElementById("lane-delivered-badge");
      const dropBadge = document.getElementById("lane-dropped-badge");
      if (delivBadge) delivBadge.textContent = `Delivered ${laneState.deliveredCount}`;
      if (dropBadge) dropBadge.textContent = `Dropped ${laneState.droppedCount}`;

      if (Date.now() < laneState.killedFlashUntil) {
        ctx.fillStyle = "rgba(220, 38, 38, 0.14)";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "#991b1b";
        ctx.font = compact ? "800 13px system-ui, sans-serif" : "800 17px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("💀 WORKER SIGKILL'D — STATE SAFE IN ATLAS", w * 0.5, 24);
      }

      requestAnimationFrame(drawFrame);
    }
    requestAnimationFrame(drawFrame);

    document.addEventListener("DOMContentLoaded", () => {
      const btn = document.getElementById("btn-audience-kill");
      if (btn) {
        btn.addEventListener("click", audienceKill);
      }
      if (INITIAL_SNAPSHOT) {
        renderSecretSnapshot(INITIAL_SNAPSHOT);
      }
      if (window.FinishLineLiveRun) {
        FinishLineLiveRun.connectLiveRun({
          runId: REQUESTED_RUN_ID,
          onSnapshot: renderSecretSnapshot,
        });
      }
      pollDockerTopology();
      setInterval(pollDockerTopology, 1500);
      setInterval(updateKillButton, 500);
    });
  </script>
</body>
</html>
